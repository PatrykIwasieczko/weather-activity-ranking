services:
  postgres:
    image: postgres:16-alpine
    container_name: weather-activity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather_activity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather_activity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
